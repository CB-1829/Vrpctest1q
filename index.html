<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Physics Playground - Fixed</title>
    <!-- Using 1.5.0 for the best performance on Quest 3/Pro -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Physics engine: C-Frame version is the only one compatible with 1.5.0 -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <!-- Super Hands for grabbing -->
    <script src="https://unpkg.com/aframe-super-hands-component@^3.0.2/dist/aframe-super-hands.min.js"></script>
    <!-- FIXED: Using the modern teleport-controls version that supports A-Frame 1.5.0 -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-teleport-controls@0.4.3/dist/aframe-teleport-controls.min.js"></script>
    <!-- Tailwind for the Start UI -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #000; }
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            background: radial-gradient(circle at center, #1e1b4b 0%, #000000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .start-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none; border-radius: 50px; padding: 20px 60px;
            color: white; font-size: 1.5rem; font-weight: 800; cursor: pointer;
            box-shadow: 0 0 30px rgba(79, 70, 229, 0.4);
            transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }
        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.6); color: white; padding: 15px;
            border-radius: 12px; pointer-events: none; border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 class="text-4xl font-black text-white mb-4 tracking-tight">PHYSICS WORLD</h1>
        <p class="text-indigo-300 mb-8 uppercase tracking-widest text-sm font-bold">WebXR Immersive Experience</p>
        <button id="start-btn" class="start-btn">ENTER VR</button>
        <p class="text-slate-500 mt-6 text-xs">Headset Required for Full Interaction</p>
    </div>

    <div id="hud">
        <b class="text-indigo-400">Controls:</b><br>
        • Left Trigger: Teleport<br>
        • Right Grip: Pick Up Blocks<br>
        • Right Trigger: Throw Blocks
    </div>

    <a-scene physics="debug: false; gravity: -9.8" xr-mode-ui="enabled: false">
        
        <a-assets>
            <a-mixin id="cube" geometry="primitive: box; width: 0.3; height: 0.3; depth: 0.3"
                     hoverable grabbable stretchable draggable
                     dynamic-body="shape: box; mass: 2" shadow></a-mixin>
            
            <a-mixin id="hand" 
                     super-hands="colliderEvent: raycaster-intersection;
                                  colliderEventProperty: els;
                                  colliderEndEvent: raycaster-intersection-cleared;
                                  colliderEndEventProperty: clearedEls;">
            </a-mixin>
        </a-assets>

        <!-- Environment -->
        <a-sky color="#020617"></a-sky>
        <a-light type="ambient" intensity="0.5"></a-light>
        <a-light type="directional" position="2 4 3" intensity="0.8" castShadow="true"></a-light>

        <!-- Floor -->
        <a-plane static-body rotation="-90 0 0" width="50" height="50" color="#0f172a" shadow></a-plane>
        
        <!-- Table -->
        <a-box static-body position="0 0.5 -1.5" width="2" height="1" depth="1" color="#1e293b" shadow></a-box>

        <!-- Objects -->
        <a-entity mixin="cube" position="-0.4 1.2 -1.4" material="color: #6366f1"></a-entity>
        <a-entity mixin="cube" position="0 1.2 -1.4" material="color: #10b981"></a-entity>
        <a-entity mixin="cube" position="0.4 1.2 -1.4" material="color: #f43f5e"></a-entity>
        <a-entity mixin="cube" position="0 1.7 -1.4" material="color: #f59e0b"></a-entity>

        <a-entity id="rig">
            <a-camera position="0 1.6 0">
                <a-cursor color="white" raycaster="objects: [grabbable]" opacity="0.5"></a-cursor>
            </a-camera>
            
            <!-- Left Hand: Movement -->
            <a-entity id="leftHand"
                      hand-controls="hand: left"
                      teleport-controls="cameraRig: #rig; teleportOrigin: a-camera; button: trigger; type: parabolic; curveHitColor: #6366f1;">
            </a-entity>

            <!-- Right Hand: Interaction -->
            <a-entity id="rightHand" mixin="hand"
                      hand-controls="hand: right"
                      sphere-collider="objects: [grabbable]; radius: 0.15">
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const btn = document.getElementById('start-btn');
        const overlay = document.getElementById('start-overlay');
        const scene = document.querySelector('a-scene');
        const hud = document.getElementById('hud');

        btn.addEventListener('click', function() {
            // CRITICAL: Request VR session immediately upon click to satisfy browser security
            if (scene.enterVR) {
                scene.enterVR();
            }

            // Enter fullscreen for the flat display
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // Hide the UI
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                hud.style.display = 'block';
            }, 500);
        });

        // Add visual feedback for picking things up
        document.querySelectorAll('[grabbable]').forEach(el => {
            el.addEventListener('grab-start', () => el.setAttribute('material', 'emissive', '#222'));
            el.addEventListener('grab-end', () => el.setAttribute('material', 'emissive', '#000'));
        });
    </script>
</body>
</html>
